---
name: test

on: [push]

env:
  APP_NAME: 'zfw'
  MAINTAINER: 'Robert Caamano'
  DESC: 'An ebpf based statefull fw for openziti edge-routers and tunnelers'
  ROUTER_PREFIX: 'zfw-router'
  TF_VAR_test_iterate_count: 2
  NF_API_CLIENT_ID: "${{ secrets.NF_API_CLIENT_ID }}"
  NF_API_CLIENT_SECRET: "${{ secrets.NF_API_CLIENT_SECRET }}"
  TEST_TIMEOUT: ${{vars.TEST_TIMEOUT}}

jobs: 
  regression_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    steps: 
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          repository: netfoundry/cloud-network-lb-ingress
      - 
        name: Authenticate to AWS Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_FOR_GITHUB }}
          role-session-name: GitHubActions
          audience: sts.amazonaws.com
      - 
        name: install-terraform-jq
        run: |
          sudo apt-get update 
          sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | \
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
        shell: bash
      - 
        name: start-test
        if: success() || failure()
        run: |
          cd ${{ github.workspace }}/AWS/tf-provider/
          ssh-keygen -t rsa -b 4096 -C "cldeng@netfoundry.io" -f ./zfw_rsa -q -N ""
          export TF_VAR_ssh_public_key=`cat ./zfw_rsa.pub`
          ./test_cases.sh run
        shell: bash
      - 
        name: check-interception:test-status
        if: success() || failure()
        run: |
          set -xe
          cd ${{ github.workspace }}/AWS/tf-provider/
          terraform workspace show
          terraform output -json | jq .client_public_ips.value
          terraform output -json | jq .backend_public_ips.value
          START_TIME=$EPOCHSECONDS
          WC=0
          while :
          do
            /usr/bin/ssh -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -i ./zfw_rsa ziggy@$(terraform output -json | jq -r .client_public_ips.value[0]) -tq '/usr/bin/ps -auxf | grep http | grep -v ziggy' > ${{ github.workspace }}/AWS/tf-provider/status
            /usr/bin/ssh -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -i ./zfw_rsa ziggy@$(terraform output -json | jq -r .client_public_ips.value[1]) -tq '/usr/bin/ps -auxf | grep http | grep -v ziggy' >> ${{ github.workspace }}/AWS/tf-provider/status 
            WC=`/usr/bin/cat ${{ github.workspace }}/AWS/tf-provider/status |wc -l`
            echo "$WC Process(es) still running and $(( TEST_TIMEOUT-(EPOCHSECONDS-START_TIME) )) seconds left to reach execution timeout"
            sleep 60
            if (( $WC == 0 || EPOCHSECONDS-START_TIME > TEST_TIMEOUT )); then
              break
            fi
          done
          echo "done!"
          set +xe
        shell: bash
      - 
        name: check-interception:test-result
        if: success() || failure()
        run: |
          set -xe
          cd ${{ github.workspace }}/AWS/tf-provider/
          /usr/bin/ssh -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -i ./zfw_rsa ziggy@$(terraform output -json | jq -r .client_public_ips.value[0]) -tq '/usr/bin/tail -n 1 /var/log/http_test.json' > ${{ github.workspace }}/AWS/tf-provider/result
          /usr/bin/ssh -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -i ./zfw_rsa ziggy@$(terraform output -json | jq -r .client_public_ips.value[1]) -tq '/usr/bin/tail -n 1 /var/log/http_test.json' >> ${{ github.workspace }}/AWS/tf-provider/result
          /usr/bin/cat ${{ github.workspace }}/AWS/tf-provider/result
          count=`/usr/bin/cat result | grep Passed |wc -l`
          if [ $count == 2 ]; then
            echo -e "\033[32mPASSED\033[m"
            exit 0
          elif [ $count == 1 ]; then
            echo -e "\033[33mPARTIALLYPASSED\033[m"
            exit 1
          else
             echo -e "\033[31mFAILED\033[m"
             exit 1
          fi
          set +xe
        shell: bash
      - 
        name: cleanup-test
        if: success() || failure()
        run: |
          cd ${{ github.workspace }}/AWS/tf-provider/
          export TF_VAR_ssh_public_key=`cat ./zfw_rsa.pub`
          ./test_cases.sh cleanup
          rm ./zfw_rsa*
        shell: bash
